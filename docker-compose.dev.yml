# Local development stack: booking API + Postgres. Values come from .env
# (copy .env.example). Never used in the cluster: there, secrets come from Vault.
name: aiops-dev

services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: booking-api:dev
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres          # the compose service, not localhost
      POSTGRES_PORT: 5432              # container port, whatever is published
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # `make test` only (profile keeps it out of `make dev-up`). The repo is mounted
  # read-only, so tests always run the code on disk without rebuilding.
  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: app/Dockerfile
      target: test
    image: booking-api:test
    user: "10001:10001"
    working_dir: /src
    volumes:
      - ./:/src:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TEST_POSTGRES_DB: booking_test   # tests never touch the dev database
      REQUIRE_DB: "1"                  # fail, don't skip, if Postgres is unreachable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
