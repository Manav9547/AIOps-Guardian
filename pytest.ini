[pytest]
testpaths = app/tests
# The repo is mounted read-only in `make test`, so no .pytest_cache.
addopts = -ra -p no:cacheprovider
markers =
    db: needs a running Postgres (skipped without one unless REQUIRE_DB=1)
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
